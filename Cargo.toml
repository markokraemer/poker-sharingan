[workspace]
resolver = "2"
members = [
  "engine/cards", "engine/iso", "engine/nlhe",
  "sharingan-1/abstraction", "sharingan-1/blueprint", "sharingan-1/search", "sharingan-1/pluribus", "sharingan-1/serve",
  "arena/bench", "arena/exploit", "arena/referee", "arena/openpoker", "arena/server",
  "research/cfr-lab", "research/search-lab",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/markokraemer/poker-sharingan"

[workspace.dependencies]
cards = { path = "engine/cards" }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
panic = "abort"

[profile.test]
opt-level = 2

[workspace.metadata]
name = "Poker Sharingan"
description = "The poker bot arena: open engine, harness and luck-corrected scoring, plus SHARINGAN-1, an open Pluribus reproduction."

# Long-running servers: same as release but a panic unwinds (caught per request) instead of aborting the process.
[profile.serve]
inherits = "release"
panic = "unwind"
