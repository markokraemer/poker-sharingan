[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/markokraemer/poker-sharingan"

[workspace.dependencies]
cards = { path = "crates/cards" }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
panic = "abort"

[profile.test]
opt-level = 2

[workspace.metadata]
name = "SHARINGAN"
description = "SHARINGAN: an open, agent-built reproduction of Pluribus (6-max no-limit hold'em): MCCFR blueprint plus real-time search."
