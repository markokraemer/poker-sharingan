[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-sharingan"
version = "0.1.0"
description = "Bot SDK for the Poker Sharingan arena (Table API v1)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["websockets>=12"]

[project.scripts]
sharingan = "sharingan.cli:main"

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sharingan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
